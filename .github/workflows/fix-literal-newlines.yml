name: Fix literal newline artifacts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[newline-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace literal backslash-n sequences in HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              fixed = text.replace('\\n', '\n')
              if fixed != text:
                  path.write_text(fixed, encoding='utf-8')
                  changed.append(str(path))
          print('Changed:', changed)
          PY
      - name: Verify no literal newline artifacts remain
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '\\n' in text:
                  bad.append(str(path))
          if bad:
              raise SystemExit('Literal \\n remains in: ' + ', '.join(bad))
          print('All HTML files clean.')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Remove literal newline artifacts [newline-cleanup]"
          git push origin main
