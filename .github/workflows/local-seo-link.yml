name: Local SEO link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'SEO: link Cuyahoga Falls') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link local landing page
        shell: python
        run: |
          from pathlib import Path
          p = Path('service-area/index.html')
          text = p.read_text(encoding='utf-8')
          old = '<div class="city-card featured"><div class="place"><span class="pin">01</span><h3>Cuyahoga Falls</h3></div><p>Our home base and the center of the Persnickety service area.</p></div>'
          new = '<a class="city-card featured" href="../cuyahoga-falls-window-cleaning/"><div class="place"><span class="pin">01</span><h3>Cuyahoga Falls</h3></div><p>Our home base and the center of the Persnickety service area. Explore Cuyahoga Falls window cleaning →</p></a>'
          if old not in text:
              raise SystemExit('Expected Cuyahoga Falls card not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/local-seo-link.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-area/index.html .github/workflows/local-seo-link.yml
          git commit -m "Link Cuyahoga Falls local landing page"
          git push
