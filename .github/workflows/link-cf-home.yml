name: Link Cuyahoga Falls from homepage

on:
  push:
    paths:
      - ".github/workflows/link-cf-home.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link local page
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          old = '<div class="cities"><div class="city">Cuyahoga Falls</div>'
          new = '<div class="cities"><a class="city" href="cuyahoga-falls-window-cleaning/">Cuyahoga Falls</a>'
          if old not in text:
              raise SystemExit("Homepage city anchor not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/link-cf-home.yml").unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/link-cf-home.yml
          git commit -m "Link homepage to Cuyahoga Falls service page"
          git push
